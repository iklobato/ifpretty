---
name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is the oldest supported (requires-python >= 3.9).
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install . pytest
      - name: Tests
        run: python -m pytest tests -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install . mypy ruff
      - name: mypy --strict
        run: mypy --strict src docs/make_images.py
      - name: ruff
        run: |
          ruff check src tests docs
          ruff format --check src tests docs

  readme-images:
    # The README pictures must match what the code prints today.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Regenerate SVGs
        run: uv run --frozen python docs/make_images.py --svg-only
      - name: Fail when docs/img is stale
        run: |
          git status --porcelain docs/img
          git diff --stat docs/img
          git diff -U0 docs/img | grep '^[-+]' | grep -v '^[-+][-+]' | head -40
          test -z "$(git status --porcelain docs/img)"
